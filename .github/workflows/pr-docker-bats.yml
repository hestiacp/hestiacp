name: BATS testsuite

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  docker-bats-nginx-apache:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      INSTALL_APACHE_ARGS: "--apache yes"

    steps: &bats-steps
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build CI container
        run: |
          docker build \
            -f .github/docker/hestia-ci.Dockerfile \
            -t hestia-ci:${{ github.sha }} \
            .

      - name: Create IPv6-enabled network
        run: |
          # GitHub-hosted runners have no routable IPv6 egress, so this uses a
          # ULA (fd00::/8) subnet purely to give the container a real, non-loopback
          # IPv6 address on eth0 — enough to exercise Hestia's dual-stack detection
          # and ip6tables paths without needing internet-routable IPv6.
          docker network create \
            --driver bridge \
            --ipv6 \
            --subnet fd00:dead:beef::/64 \
            hestia-ci-net

      - name: Start CI container
        run: |
          docker run -d \
            --name hestia-ci \
            --hostname hestia-dev.local \
            --privileged \
            --cgroupns=host \
            --network hestia-ci-net \
            --tmpfs /run \
            --tmpfs /run/lock \
            --tmpfs /tmp:exec,mode=1777 \
            --dns 8.8.8.8 \
            --dns 8.8.4.4 \
            --dns 2001:4860:4860::8888 \
            --dns 2001:4860:4860::8844 \
            -e TZ=UTC \
            -e LANG=en_US.UTF-8 \
            -e LC_ALL=en_US.UTF-8 \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "${GITHUB_WORKSPACE}:/hestiacp-git" \
            -w /hestiacp-git \
            hestia-ci:${{ github.sha }}
          for _ in {1..100}; do
            docker exec hestia-ci bash -lc 'systemctl is-system-running 2>/dev/null | grep -Eq "running|degraded"' && break
            sleep 0.1
          done

      - name: Build local Hestia packages
        run: |
          docker exec hestia-ci bash -lc '
            set -euxo pipefail
            export TERM=xterm
            cd /hestiacp-git/src
            # Build the control panel plus its backend packages (hestia-php,
            # hestia-nginx, hestia-web-terminal) so the install below does not
            # depend on apt.hestiacp.com being in sync. --pkgrev 99 keeps the
            # local versions above any published package.
            bash ./hst_autocompile.sh --all --pkgrev 99 --noinstall --keepbuild "~localsrc"

            DEB_PATH=/tmp/hestiacp-src/debs
            rm -rf "${DEB_PATH}"
            mkdir -p "${DEB_PATH}"
            cp /tmp/hestiacp-src/deb/*.deb "${DEB_PATH}/"

            # Fail here, not silently inside the installer, if the build did not
            # produce every package the installer needs.
            for pkg in hestia hestia-php hestia-nginx hestia-web-terminal; do
              if ! compgen -G "${DEB_PATH}/${pkg}_*.deb" > /dev/null; then
                echo "No ${pkg}_*.deb produced by hst_autocompile.sh"
                ls -la /tmp/hestiacp-src/deb || true
                exit 1
              fi
            done
            ls -la "${DEB_PATH}"
          '

      - name: Install Hestia from local debs
        run: |
          docker exec hestia-ci bash -lc '
            set -euxo pipefail
            cd /hestiacp-git
            bash install/hst-install-ubuntu.sh \
              --hostname hestia.local.test \
              --email admin@example.com \
              --username admin \
              --password Password123 \
              --interactive no \
              --force \
              --with-debs /tmp/hestiacp-src/debs \
              ${{ env.INSTALL_APACHE_ARGS }} \
              --clamav no \
              --spamassassin no

            # The installer silently falls back to apt.hestiacp.com when a
            # local deb is missing, so assert the local builds were used and
            # fully configured (dpkg -i leaves failed packages unpacked).
            for pkg in hestia hestia-php hestia-nginx; do
              info="$(dpkg-query -s "${pkg}" 2> /dev/null || true)"
              if ! grep -F "Status: install ok installed" <<< "${info}" > /dev/null ||
                ! grep -F -- "-99+" <<< "${info}" > /dev/null; then
                echo "${pkg} was not installed from the local build"
                printf "%s\n" "${info}"
                exit 1
              fi
            done
          '

      - name: Run BATS test suite
        run: |
          docker exec hestia-ci bash -lc '
            set -euxo pipefail
            cd /hestiacp-git
            if ! command -v bats >/dev/null 2>&1; then
              test/test_helper/bats-core/install.sh /usr/local
            fi
            bats test/test.bats test/upgrade/1.10.6.bats
          '

      - name: Collect logs on failure
        if: failure()
        run: |
          docker exec hestia-ci bash -lc 'journalctl --no-pager -n 500' || true
          docker exec hestia-ci bash -lc 'ls -la /root/hst_install_backups || true' || true
          docker exec hestia-ci bash -lc 'tail -n 500 /root/hst_install_backups/hst_install-*.log || true' || true
          echo "--- apache2/nginx/php-fpm unit logs (full run, not just the last 500 journal lines) ---"
          docker exec hestia-ci bash -lc 'journalctl --no-pager -u apache2 -u nginx -u "php*-fpm*"' || true
          echo "--- apache2/nginx service status ---"
          docker exec hestia-ci bash -lc 'systemctl status apache2 nginx --no-pager -l' || true
          echo "--- apachectl / nginx config test ---"
          docker exec hestia-ci bash -lc 'apachectl configtest; nginx -t' || true
          echo "--- per-domain apache/nginx error logs ---"
          docker exec hestia-ci bash -lc 'tail -n 200 /var/log/apache2/domains/*.error.log /var/log/apache2/error.log 2>/dev/null' || true
          echo "--- registered IPs (primary_ipv6 auto-registration included) ---"
          docker exec hestia-ci bash -lc 'grep -r "" /usr/local/hestia/data/ips/ 2>/dev/null' || true
          echo "--- generated vhost configs for any web domain ---"
          docker exec hestia-ci bash -lc 'find /home -path "*/conf/web/*/apache2.conf" -o -path "*/conf/web/*/nginx.conf" | xargs -r -I{} sh -c "echo ===={}====; cat {}"' || true

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f hestia-ci || true
          docker network rm hestia-ci-net || true

  # Same suite against an nginx-only install (no Apache2). Runs in parallel
  # with the nginx + Apache2 job on its own runner and container.
  docker-bats-nginx:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      INSTALL_APACHE_ARGS: "--apache no"
    steps: *bats-steps
