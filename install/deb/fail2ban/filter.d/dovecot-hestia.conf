# Fail2Ban filter for Dovecot as configured by HestiaCP (/var/log/dovecot.log)
#
# The stock dovecot filter shipped with fail2ban does not match this log:
#  - Dovecot >= 2.3.13 logs "Login aborted: Connection closed (auth failed,
#    N attempts in M secs) (auth_failed): ..." which the stock filter (<= 1.1.0)
#    does not cover.
#  - Exim authenticates SMTP users through the Dovecot auth-client socket, so
#    auth failures appear as "auth(user@domain,<ip>,sasl:<mech>): ..." with the
#    client IP inside the auth(...) prefix that common.conf's __prefix_line
#    would consume before <HOST> can be extracted.
#  - Hestia's per-domain passwd-file passdb (/etc/exim4/domains/<domain>/passwd)
#    logs "passwd-file: missing passwd file:" on user-enumeration attempts and
#    "passwd-file: unknown user"/"Password mismatch" on SMTP AUTH failures
#    against existing domains, which no upstream filter covers.
#
# Failed attempts per matching line (verified on Dovecot 2.4): a failed
# IMAP/POP3 login logs two matching lines (the auth(...)<session> line and
# the *-login "Login aborted ... (auth failed" line), a failed SMTP AUTH one
# (auth(...) without session). The jail's maxretry = 10 therefore means about
# 5 failed IMAP/POP3 logins, as the default maxretry = 5 did with the stock
# filter.
#
# For that reason this filter does not use common.conf/__prefix_line: the
# service prefix is captured inside <F-CONTENT> so the IP stays reachable.

[Definition]

_login_service = (?:pop3|imap|managesieve|submission)-login

prefregex = ^\s*<F-CONTENT>(?:%(_login_service)s: |auth\([^)]*\)(?:<\S+>)?: |auth(?:-worker\(\d+\))?: |[a-z\-]{3,15}\([^)]*\): |pam_[a-z]+(?:\(dovecot:auth\))?: ).+</F-CONTENT>$

failregex = ^%(_login_service)s: (?:Info: )?(?:Login aborted|Aborted login|Disconnected|Remote closed connection|Client has quit the connection)(?:: (?:\w+\([^\):]*\) \w+|(?:[^\(:]|:(?! ))+))* \((?:auth failed, \d+ attempts(?: in \d+ secs)?|tried to use (?:disabled|disallowed) \S+ auth|proxy dest auth failed)\)[^:]*:(?: user=<[^>]*>,)?(?: method=\S+,)? rip=<HOST>[^>]*(?:, session=<\S+>)?\s*$
            ^%(_login_service)s: Info: Login failed: [^:]+: user=<[^>]*>,(?: method=\S+,)? rip=<HOST>[^>]*(?:, session=<\S+>)?\s*$
            ^auth\([^,]*,<HOST>,sasl:[^)]*\)(?:<\S+>)?: Info: passwd-file: (?:missing passwd file|unknown user|user not found|[Pp]assword mismatch)\b.*$
            ^auth\([^,]*,<HOST>,sasl:[^)]*\)(?:<\S+>)?: Info: (?:(?:login|plain): )?(?:Empty username|Username character disallowed)\b.*$
            ^(?:auth(?:-worker\(\d+\))?: )?(?:Info: )?passwd-file\([^,]*,<HOST>(?:,<[^>]+>)?\): (?:missing passwd file|unknown user|user not found|[Pp]assword mismatch)\b.*$
            ^(?:auth(?:-worker\(\d+\))?: )?pam_[a-z]+(?:\(dovecot:auth\))?: authentication failure; logname=\S* uid=\S* euid=\S* tty=dovecot ruser=\S* rhost=<HOST>(?:\s+user=\S*)?\s*$
            ^(?:auth(?:-worker\(\d+\))?: )?(?:Info: )?pam\(\S+,<HOST>(?:,\S*)?\): pam_authenticate\(\) failed: (?:User not known to the underlying authentication module: \d+ Time\(s\)|Authentication failure \([Pp]assword mismatch\?\)|Permission denied)\s*$
            ^(?:auth(?:-worker\(\d+\))?: )?(?:Info: )?[a-z\-]{3,15}\(\S*,<HOST>(?:,\S*)?\): (?:[Uu]nknown user|[Ii]nvalid credentials|[Pp]assword mismatch)

ignoreregex =

datepattern = {^LN-BEG}
