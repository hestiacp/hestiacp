# Fail2Ban filter for Dovecot as configured by HestiaCP (/var/log/dovecot.log)
#
# The stock dovecot filter shipped with fail2ban does not match this log:
#  - Dovecot >= 2.3.13 logs "Login aborted: Connection closed (auth failed,
#    N attempts in M secs) (auth_failed): ..." which the stock filter (<= 1.1.0)
#    does not cover.
#  - Exim authenticates SMTP users through the Dovecot auth-client socket, so
#    auth failures appear as "auth(user@domain,<ip>,sasl:<mech>): ..." with the
#    client IP inside the auth(...) prefix. common.conf's __prefix_line would
#    consume that prefix (including the IP) before <HOST> can be extracted.
#  - Hestia's per-domain passwd-file passdb (/etc/exim4/domains/<domain>/passwd)
#    logs "passwd-file: missing passwd file:" on user-enumeration attempts,
#    which no upstream filter covers.
#
# For that reason this filter does not use common.conf/__prefix_line: the
# service prefix is captured inside <F-CONTENT> so the IP stays reachable.

[Definition]

_login_service = (?:pop3|imap|managesieve|submission)-login

prefregex = ^\s*<F-CONTENT>(?:%(_login_service)s: |auth\([^)]*\)(?:<\S+>)?: ).+</F-CONTENT>$

failregex = ^%(_login_service)s: (?:Info: )?(?:Login aborted|Aborted login|Disconnected|Remote closed connection|Client has quit the connection)(?:: (?:\w+\([^\):]*\) \w+|[^\(]+))* \((?:auth failed, \d+ attempts(?: in \d+ secs)?|tried to use (?:disabled|disallowed) \S+ auth|proxy dest auth failed)\)[^:]*:(?: user=<[^>]*>,)?(?: method=\S+,)? rip=<HOST>[^>]*(?:, session=<\S+>)?\s*$
            ^%(_login_service)s: Info: Login failed: [^:]+: user=<[^>]*>,(?: method=\S+,)? rip=<HOST>[^>]*(?:, session=<\S+>)?\s*$
            ^auth\([^,]*,<HOST>,sasl:[^)]*\)(?:<\S+>)?: Info: passwd-file: missing passwd file:.*$

ignoreregex =

datepattern = {^LN-BEG}
