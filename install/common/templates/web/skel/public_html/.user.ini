; ==============================================================================
; PHP .user.ini Custom Configuration File
; ==============================================================================
; 
; This file allows you to override default PHP settings for this specific 
; directory and all its subdirectories. 
; 
; Important Notes:
; - Only INI settings with the modes PHP_INI_PERDIR and PHP_INI_USER will be 
;   recognized in .user.ini files.
; - Changes made in this file may take a few minutes to apply, depending on the
;   user_ini.cache_ttl setting in the server's main php.ini (default is 300 
;   seconds / 5 minutes).
; 
; For a full list of core php.ini directives, see: 
; https://www.php.net/manual/en/ini.list.php
; ==============================================================================

; --- Resource Limits ---
; The maximum amount of memory a script may consume.
;memory_limit = 128M

; The maximum time in seconds a script is allowed to run before it is terminated.
;max_execution_time = 30

; The maximum time in seconds a script is allowed to parse input data, like POST and GET.
;max_input_time = 60

; How many GET/POST/COOKIE input variables may be accepted.
;max_input_vars = 1000

; --- Data Uploads ---
; The maximum size of an uploaded file.
;upload_max_filesize = 2M

; The maximum size of POST data that PHP will accept.
; This should generally be larger than upload_max_filesize.
;post_max_size = 8M

; --- Error Handling ---
; Determine whether errors should be printed to the screen. 
; (Recommended to be 'Off' in production)
;display_errors = Off

; --- Date & Time ---
; Defines the default timezone used by the date functions.
;date.timezone = "UTC"

; --- Security & Other ---
; Enable/disable file uploads altogether.
;file_uploads = On
